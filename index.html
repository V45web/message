<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚠️ IMPORTANT MESSAGE ⚠️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      text-align: center;
    }.card {
  max-width: 500px;
  padding: 30px;
  border-radius: 16px;
  background: rgba(0, 0, 0, 0.75);
  box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
  animation: pulse 2s infinite;
}

h1 {
  color: #ff3333;
  margin-bottom: 15px;
}

p {
  font-size: 1.1rem;
  line-height: 1.6;
}

.symbols {
  font-size: 1.6rem;
  margin-top: 15px;
}

.share {
  margin-top: 20px;
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  cursor: pointer;
  background: linear-gradient(45deg, #ff0000, #ff8800);
  color: #fff;
}

.share:hover {
  opacity: 0.85;
}

@keyframes pulse {
  0% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); }
  50% { box-shadow: 0 0 40px rgba(255, 0, 0, 0.8); }
  100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); }
}

  </style>
</head>
<body>
  <div class="card">
    <h1>⚠️ DON'T IGNORE ⚠️</h1>
    <p>
      Anni Mandi Sandi 😈<br /><br />
      If you <strong>DON'T</strong> share this link to your <strong>3 friends</strong> within <strong>24 hours</strong>,
      you will <strong>100% FAIL</strong> in the incoming EXAM 😱📚
    </p>
    <p>
      So share this link within <strong>24 hours</strong>.<br />
      <strong>FAST!</strong>
    </p>
    <div class="symbols">✡️ 🔯 🧿 🪬 🔮</div>
    <button class="share" onclick="shareLink()">Share This Link</button>
  </div>  <script>
    function shareLink() {
      const link = window.location.href;
      if (navigator.share) {
        navigator.share({
          title: "⚠️ IMPORTANT MESSAGE ⚠️",
          text: "DON'T IGNORE! Read this fast!",
          url: link
        });
      } else {
        alert("Copy and share this link:\n" + link);
      }
    }
  </script></body>
</html>
